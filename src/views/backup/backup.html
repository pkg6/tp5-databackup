<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>数据库备份案例</title>
    <link href="{$layui.layuicss}" rel="stylesheet">
</head>
<body>

<!--表格呈现-->
<table class="layui-hide" id="elem-backup-tables" lay-url="{$routes.tables}"></table>
<!--批量操作-->
<script type="text/html" id="table-opt">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="import" lay-url="{$routes.view_import}">还原</button>
        <button class="layui-btn layui-btn-sm" id="backups-status"
                lay-event="backups"
                backup-process-id="backup-process"
                step1-url="{$routes.backupStep1}"
                step2-url="{$routes.backupStep2}"
                step3-url="{$routes.cleanup}">备份表
        </button>
        <button class="layui-btn layui-btn-disabled" id="backup-process">备份状态变化</button>
        <button class="layui-btn layui-btn-sm" lay-event="optimizes" lay-url="{$routes.optimize}">优化表</button>
        <button class="layui-btn layui-btn-sm" lay-event="repairs" lay-url="{$routes.repair}">修复表</button>

    </div>
</script>
<!--单行操作-->
<script type="text/html" id="table-row-opt">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="optimize" lay-url="{$routes.optimize}">优化表</button>
        <button class="layui-btn layui-btn-sm" lay-event="repair" lay-url="{$routes.repair}">修复表</button>
    </div>
</script>

<script src="{$layui.layuijs}"></script>

<script>
    layui.use(['table', 'layer'], function () {
        var table = layui.table;
        var layer = layui.layer;
        var $ = layui.jquery;

        var elem = 'elem-backup-tables';
        var url = document.getElementById(elem).getAttribute("lay-url");

        table.render({
            elem: '#' + elem,
            url: url,
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'name', title: '表名', width: 200},
                {field: 'engine', title: '引擎', width: 120},
                {field: 'rows', title: '数据量', width: 120},
                {field: 'data_length', title: '数据大小', width: 120},
                {field: 'collation', title: '排序规则', width: 180},
                {field: 'comment', title: '表注释', width: 120},
                {field: 'create_time', title: '创建时间', width: 180},
                {fixed: 'right', title: '操作', width: 200, toolbar: '#table-row-opt'}
            ]],
            toolbar: '#table-opt',
        });

        function getCheckedTableNames(obj) {
            var data = table.checkStatus(obj.config.id).data;
            var names = [];
            for (var i = 0; i < data.length; i++) {
                names.push(data[i].name);
            }
            return names;
        }

        table.on("toolbar(" + elem + ")", function (obj) {
            var btn = this;
            switch (obj.event) {
                case 'import':
                    location.href = btn.getAttribute("lay-url");
                    break;
                case 'backups':
                    var tables = getCheckedTableNames(obj);
                    var step1_url = btn.getAttribute("step1-url");
                    var step2_url = btn.getAttribute("step2-url");
                    var step3_url = btn.getAttribute("step3-url");
                    var process_id = btn.getAttribute("backup-process-id");
                    var processEl = process_id ? document.getElementById(process_id) : null;

                    $.ajax({
                        type: "POST",
                        url: step1_url,
                        data: {"tables": tables},
                        success: function (ret1) {
                            if (ret1.code !== 0) {
                                return layer.msg(ret1.msg);
                            }
                            if (processEl) processEl.innerHTML = ret1.msg;
                            btn.classList.add('layui-btn-disabled');

                            var file = ret1.data.file;
                            var list = ret1.data.tables;
                            var idx = 0;

                            function backupTable() {
                                if (idx >= list.length) {
                                    $.ajax({
                                        type: "GET",
                                        url: step3_url,
                                        success: function () {
                                            if (processEl) processEl.innerHTML = "备份完毕";
                                            btn.classList.remove('layui-btn-disabled');
                                        }
                                    });
                                    return;
                                }

                                var tableName = list[idx].table;
                                if (processEl) processEl.innerHTML = "当前正在备份的表:" + tableName;

                                function backupPage(page) {
                                    $.ajax({
                                        type: "GET",
                                        url: step2_url,
                                        data: {"file": file, "table": tableName, "page": page},
                                        success: function (ret) {
                                            if (ret.code !== 0) {
                                                return layer.msg(ret.msg);
                                            }
                                            if (ret.data.page > 0) {
                                                backupPage(ret.data.page);
                                            } else {
                                                idx++;
                                                backupTable();
                                            }
                                        }
                                    });
                                }

                                backupPage(1);
                            }

                            backupTable();
                        }
                    });
                    break;
                case 'optimizes':
                    var url = btn.getAttribute("lay-url");
                    var tables = getCheckedTableNames(obj);
                    $.ajax({
                        type: 'POST',
                        url: url,
                        data: {"tables": tables},
                        success: function (ret) {
                            layer.msg(ret.msg);
                        }
                    });
                    break;
                case 'repairs':
                    var url = btn.getAttribute("lay-url");
                    var tables = getCheckedTableNames(obj);
                    $.ajax({
                        type: 'POST',
                        url: url,
                        data: {"tables": tables},
                        success: function (ret) {
                            layer.msg(ret.msg);
                        }
                    });
                    break;
            }
        });

        table.on("tool(" + elem + ")", function (obj) {
            var btn = this;
            switch (obj.event) {
                case 'optimize':
                case 'repair':
                    var url = btn.getAttribute("lay-url");
                    $.ajax({
                        type: 'POST',
                        url: url,
                        data: {"tables": obj.data.name},
                        success: function (ret) {
                            layer.msg(ret.msg);
                        }
                    });
                    break;
            }
        });
    });
</script>
</body>
</html>
